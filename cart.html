<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cart | Coffee House</title>

        <!-- Favicon -->
        <link rel="icon" type="image/png" href="assets/images/logo.png" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

        <!-- Styles -->
        <link rel="stylesheet" href="css/style.min.css" />
    </head>

    <body>
        <div class="container">
            <!-- BURGER MENU -->
            <div class="burger-menu" id="burgerMenu">
                <div class="burger-menu__header">
                    <img src="assets/images/logo.png" alt="Coffee House logo" class="burger-menu__logo" />
                    <button class="burger-menu__close" id="burgerClose" aria-label="Close menu"></button>
                </div>

                <nav class="burger-menu__nav">
                    <ul>
                        <li><a href="index.html#enjoy">Home</a></li>
                        <li><a href="index.html#about">About</a></li>
                        <li><a href="index.html#app">Mobile App</a></li>
                        <li><a href="index.html#footer">Contact Us</a></li>
                        <li>
                            <a href="menu.html" class="burger-menu__menu">
                                Menu
                                <img src="assets/icons/coffee-cup.svg" alt="coffee icon" />
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- HEADER -->
            <header class="header container">
                <div class="header__container">
                    <a href="index.html" class="header__logo">
                        <img src="assets/images/logo.png" alt="Coffee House logo" />
                    </a>
                    <nav class="nav header__nav">
                        <ul class="nav__list">
                            <li><a href="index.html#enjoy" class="menu-item">Home</a></li>
                            <li><a href="index.html#about" class="menu-item">About</a></li>
                            <li><a href="index.html#app" class="menu-item">Mobile App</a></li>
                            <li><a href="index.html#footer" class="menu-item">Contact Us</a></li>
                        </ul>
                    </nav>

                    <a href="cart.html" class="menu-item cart-link" aria-label="Cart" style="display: none">
                        <img src="assets/icons/cart.svg" alt="Cart icon" class="cart-link__icon" />
                        <span class="cart-link__counter"></span>
                    </a>

                    <a href="menu.html" class="menu-item">Menu</a>

                    <button class="button-icon-burger" id="burgerIcon"></button>
                </div>
            </header>

            <!-- MAIN CART SECTION -->
            <main>
                <section class="cart container">
                    <h2 class="favorites__title">Cart</h2>

                    <div class="cart__container">
                        <div class="cart__list" id="cartList">
                          
                        </div>

                        <div class="cart__total" id="cartTotal">
                            <span>Total:</span>
                            <div class="cart__price-container">
                                <span>$0.00</span>
                            </div>
                        </div>

                        <div class="auth-buttons">
                            <button id="clearCart" class="button-icon-dark button-icon-dark--cart">Clear Cart</button>
                        </div>
                    </div>

                    <div class="auth-buttons">
                      
                    </div>
                </section>
            </main>
        </div>

        <!-- FOOTER -->
        <footer class="footer" id="footer">
            <div class="footer__container container">
                <div class="footer__left">
                    <h2 class="footer__title">Sip, Savor, Smile.</h2>
                    <p class="footer__subtitle">It’s coffee time!</p>

                    <div class="footer__socials">
                        <a href="#" class="button-icon-light" aria-label="Twitter">
                            <img src="assets/icons/twitter.svg" alt="Twitter" />
                        </a>
                        <a href="#" class="button-icon-light" aria-label="Instagram">
                            <img src="assets/icons/instagram.svg" alt="Instagram" />
                        </a>
                        <a href="#" class="button-icon-light" aria-label="Facebook">
                            <img src="assets/icons/facebook.svg" alt="Facebook" />
                        </a>
                    </div>
                </div>

                <div class="footer__right">
                    <h3 class="footer__contact-title">Contact us</h3>
                    <ul class="footer__contact-list">
                        <li>
                            <img src="assets/icons/pin.svg" alt="" />
                            8558 Green Rd., LA
                        </li>
                        <li>
                            <img src="assets/icons/phone.svg" alt="" />
                            +1 (603) 555-0123
                        </li>
                        <li>
                            <img src="assets/icons/clock.svg" alt="" />
                            Mon–Sat: 9:00 AM – 23:00 PM
                        </li>
                    </ul>
                </div>
            </div>
        </footer>

        <!-- SCRIPTS -->
        <script src="js/burger.js"></script>
        <script type="module" src="js/cart.js"></script>
    </body>
</html>
