name: Build and Deploy Coffee House

on:
  push:
    branches: [ main, feature/business-functionality ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project (CSS, JS, TS)
        run: npm run build

      - name: Clean unnecessary folders
        run: rm -rf node_modules

      - name: Upload site files
        uses: actions/upload-pages-artifact@v2
        with:

          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (no Jekyll)
        id: deployment
        uses: actions/deploy-pages@v2
        with:
          no_jekyll: true
